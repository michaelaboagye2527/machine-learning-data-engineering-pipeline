# How Prefect Cloud gets and runs this project's code.
name: machine-learning-data-engineering-pipeline

# Before every run, Prefect clones the repository and moves into src/,
# so that `import data_engineering_pipeline` works.
pull:
  - prefect.deployments.steps.git_clone:
      id: clone
      repository:https://github.com/michaelaboagye2527/machine-learning-data-engineering-pipeline.git
      branch: main
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ clone.directory }}/src"

deployments:
  - name: hello
    entrypoint: data_engineering_pipeline/example_code.py:hello_pipeline
    parameters:
      name: Prefect Cloud
    work_pool:
      name: custom-managed-pool